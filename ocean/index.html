<style>
/* Layout: a letter block and a heading on top, a wrap of sea creature cards below (scrolls when
   a letter has many), the alphabet along the bottom. Single bright theme: the background
   changes colour with each letter, like the other two games. */
:root {
  --ink: #2d2440;
  --ink-soft: #5c5a74;
  --face: #fffdf8;
  --bg: #d4f3f1;
  --rim: #3cc4b8;
  --rim-dark: #1f9488;
  --accent: #0c6f66;
  --shadow: rgba(45, 36, 64, .16);
  --font-display: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-ui: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: light;
}

html {
  box-sizing: border-box;
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  transition: background-color .5s ease;
}
*, *::before, *::after { box-sizing: inherit; }

body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  transition: background-color .5s ease;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.stage {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px;
}

/* Top bar */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
}
.hint {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  margin: 0;
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  font: 800 clamp(13px, 1.7vmin, 16px)/1.2 var(--font-ui);
  color: var(--ink-soft);
  transition: background-color .3s, color .3s;
}
.hint kbd {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--face);
  box-shadow: 0 3px 0 var(--rim-dark);
  font: 600 16px/1 var(--font-display);
  color: var(--accent);
}
.away .hint {
  background: var(--ink);
  color: var(--face);
  animation: nudge 1.6s ease-in-out infinite;
}
.controls { display: flex; gap: 8px; flex: none; }
.ctrl {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 16px 0 12px;
  border: 0;
  border-radius: 999px;
  background: color-mix(in srgb, var(--face) 72%, transparent);
  color: var(--ink);
  font: 800 14px/1 var(--font-ui);
  cursor: pointer;
}
.ctrl:hover { background: var(--face); }
.ctrl svg { width: 22px; height: 22px; flex: none; }
.ctrl .off, .ctrl[aria-pressed="false"] .on { display: none; }
.ctrl[aria-pressed="false"] .off { display: inline; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* Scene */
.scene {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 2.4vmin, 22px);
  padding: 6px 4px 14px;
}
.head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 2.6vmin, 24px);
}
.head h1 {
  margin: 0;
  font: 600 clamp(22px, 4.4vmin, 42px)/1.05 var(--font-display);
  color: var(--ink);
  text-wrap: balance;
}
.head h1 b { color: var(--accent); font-weight: 700; }
.head p {
  margin: 6px 0 0;
  font: 700 clamp(13px, 1.9vmin, 17px)/1.3 var(--font-ui);
  color: var(--ink-soft);
}

/* A wooden alphabet block, as in the other games */
.block {
  --s: clamp(64px, 12vmin, 104px);
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
  width: var(--s);
  height: var(--s);
  border-radius: calc(var(--s) * .16);
  background: var(--face);
  box-shadow:
    inset 0 0 0 calc(var(--s) * .065) var(--rim),
    0 calc(var(--s) * .055) 0 var(--rim-dark),
    0 calc(var(--s) * .1) calc(var(--s) * .09) var(--shadow);
  font: 600 calc(var(--s) * .64)/1 var(--font-display);
  color: var(--accent);
}
.block::before {
  content: "";
  position: absolute;
  inset: calc(var(--s) * .13);
  border-radius: calc(var(--s) * .07);
  border: calc(var(--s) * .014) solid color-mix(in srgb, var(--rim) 45%, transparent);
}
.block span { position: relative; }

/* Creature cards */
.cards {
  --cw: clamp(160px, 19vw, 236px);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 16px;
}
.card {
  container-type: inline-size;
  display: flex;
  flex-direction: column;
  flex: none;
  width: var(--cw);
  padding: 0;
  border: 0;
  border-radius: 22px;
  overflow: hidden;
  background: var(--face);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--rim-dark) 45%, transparent), 0 10px 22px var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
  animation: cardIn .45s calc(var(--i) * 55ms) cubic-bezier(.3, 1.4, .5, 1) both;
}
.card:hover { transform: translateY(-3px); }
.card:active { transform: translateY(2px); }
.card.now { box-shadow: 0 0 0 4px var(--rim), 0 4px 0 4px var(--rim-dark), 0 10px 22px var(--shadow); }
.art { position: relative; display: block; aspect-ratio: 240 / 170; }
.art.reef { background: linear-gradient(#c4f1ec, #8fdcd3); }
.art.open { background: linear-gradient(#b3e0fa, #6eb4e6); }
.art.deep { background: linear-gradient(#26386a, #101b3d); }
.art.ice { background: linear-gradient(#e2f3fb, #a6d3ec); }
.art.floor { background: linear-gradient(#bfe6f5, #8ccbe6); }
.art.kelp { background: linear-gradient(#d3f1ea, #84c8bb); }
.art.snow { background: linear-gradient(#eef7ff, #d6eaf8); }
.art.beach { background: linear-gradient(#e8f5ff, #d2ecfb); }
.art svg { display: block; width: 100%; height: 100%; }
.hear {
  position: absolute;
  top: 8px;
  left: 8px;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--face) 85%, transparent);
  color: var(--ink);
}
.hear svg { width: 18px; height: 18px; }
.info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 10px 14px 14px;
}
.name {
  font: 600 clamp(16px, 9.2cqi, 23px)/1.1 var(--font-display);
  color: var(--ink);
}
.name b { color: var(--accent); font-weight: 700; }
.say {
  font: 800 12px/1.25 var(--font-ui);
  letter-spacing: .03em;
  color: var(--ink-soft);
}
.fact {
  font: 700 12.5px/1.3 var(--font-ui);
  color: var(--ink-soft);
}
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip {
  padding: 5px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--rim) 20%, var(--face));
  font: 800 11.5px/1.1 var(--font-ui);
  color: var(--ink);
}
.chip i { font-style: normal; font-family: var(--font-emoji); }

.critter {
  transform-box: fill-box;
  transform-origin: 50% 60%;
  animation: bob 3.6s calc(var(--i) * -.7s) ease-in-out infinite;
}
.card.talk .critter { animation: hop .8s cubic-bezier(.3, 1.4, .5, 1); }
.still .card { animation: none; }

@keyframes cardIn {
  from { transform: translateY(24px) scale(.85); opacity: 0; }
  to { transform: none; opacity: 1; }
}
@keyframes bob {
  0%, 100% { transform: none; }
  50% { transform: translateY(-2.5%) rotate(-1deg); }
}
@keyframes hop {
  0% { transform: none; }
  25% { transform: scale(1.06, .92); }
  55% { transform: translateY(-11%) scale(.96, 1.06) rotate(-3deg); }
  80% { transform: translateY(1%) scale(1.03, .96); }
  100% { transform: none; }
}
@keyframes pop {
  from { transform: scale(.3) rotate(-14deg); opacity: 0; }
  60% { transform: scale(1.08) rotate(3deg); opacity: 1; }
  to { transform: none; }
}
@keyframes nudge {
  0%, 100% { transform: none; }
  50% { transform: scale(1.04); }
}
@keyframes fade { from { opacity: 0; } }
.head .block { animation: pop .55s cubic-bezier(.3, 1.5, .5, 1) both; }
.still .head .block { animation: none; }

/* Alphabet strip */
.strip {
  --kg: 4px;
  --k: min(42px, calc((100vw - 32px - 25 * var(--kg)) / 26));
  display: grid;
  grid-template-columns: repeat(26, var(--k));
  gap: var(--kg);
  justify-content: center;
}
.key {
  width: var(--k);
  height: var(--k);
  padding: 0;
  border: 2px solid color-mix(in srgb, var(--ink) 14%, transparent);
  border-radius: 30%;
  background: transparent;
  color: color-mix(in srgb, var(--ink) 55%, transparent);
  font: 600 calc(var(--k) * .5)/1 var(--font-display);
  cursor: pointer;
  transition: background-color .3s, color .3s, transform .2s;
}
.key.seen { background: var(--c); border-color: transparent; color: var(--ink); }
.key.now { transform: translateY(-4px); border-color: var(--ink); }

.sr { position: absolute; top: 0; left: 0; margin: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 820px) {
  .strip {
    --k: min(40px, calc((100vw - 32px - 12 * var(--kg)) / 13));
    grid-template-columns: repeat(13, var(--k));
  }
}
@media (max-width: 560px) {
  .cards { --cw: calc((100vw - 32px - 20px) / 2); gap: 12px; }
  .info { padding: 8px 10px 12px; }
  .say { font-size: 11px; }
  .fact { font-size: 11.5px; }
  .chip { font-size: 10.5px; padding: 4px 7px; }
  .ctrl { padding: 0; width: 44px; justify-content: center; }
  .ctrl span { display: none; }
}
@media (max-height: 460px) {
  .strip { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .head .block, .critter, .card.talk .critter, .away .hint { animation: fade .3s both !important; }
}
</style>
</head>

  function colorsFor(d) {
    const [body, belly, accent0] = HUES[d.color];
    const accent = d.f.acc ? HUES[d.f.acc][0] : accent0;
    return {
      body, belly, accent,
      far: mix(body, INK, .2),
      accentFar: mix(accent, INK, .18),

      fin: d.f.fins ? HUES[d.f.fins][0] : mix(accent0, '#ffffff', .18),

  function sceneSVG(scene, rnd) {

    if (scene === 'deep') {
      let s = '';
      for (let i = 0; i < 18; i++) s += `<circle cx="${r1(rnd() * 240)}" cy="${r1(rnd() * 170)}" r="${r1(.8 + rnd() * 1.6)}" fill="#bff3ff" opacity="${r1(.3 + rnd() * .5)}"/>`;
      return s;
    }
    if (scene === 'ice') {
      return `<path d="M-5 -5 H245 V14 L222 20 L200 12 L176 22 L150 14 L120 20 L96 12 L70 22 L44 14 L20 20 L-5 12 Z" fill="#ffffff" opacity=".92"/>` + bubbles([[200, 50, 3.5], [30, 120, 3]]);
    }

      const kelp = (x) => `<path d="M${x} 176 Q${x - 14} 130 ${x} 96 T${x} 30" stroke="#3f9e62" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>`;

  function sceneOf(d) {
    if (['penguin', 'pinni', 'bird'].includes(d.plan)) return d.home === 'ice' ? 'snow' : 'beach';
    if (d.plan === 'otter') return 'kelp';
    return { reef: 'reef', open: 'open', deep: 'deep', ice: 'ice', floor: 'floor', shore: 'floor', kelp: 'kelp' }[d.home];
  }

  function drawCreature(d, uid) {
    const C = colorsFor(d);
    const far = [], back = [], sil = [], clip = [], near = [], top = [];
    let box = null, bellyD = null, off = [0, 0];
    const part = (p, fill, sw = 3.5) => `<path d="${p}" fill="${fill}" stroke="${C.ol}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const group = (paths, fill) => `<g>${paths.map(p => `<path d="${p}" fill="${C.ol}" stroke="${C.ol}" stroke-width="7" stroke-linejoin="round"/>`).join('')}${paths.map(p => `<path d="${p}" fill="${fill}"/>`).join('')}</g>`;
    const A = {
      C, part, group,
      far: s => far.push(s), back: s => back.push(s), sil: p => sil.push(p), clip: s => clip.push(s), near: s => near.push(s), top: s => top.push(s),
      box: b => { box = b; }, belly: p => { bellyD = p; }, offset: (x, y) => { off = [x, y]; },
      eye(x, y, r) {
        top.push(`<circle cx="${r1(x)}" cy="${r1(y)}" r="${r}" fill="#ffffff" stroke="${C.ol}" stroke-width="2.4"/>`
          + `<circle cx="${r1(x + r * .22)}" cy="${r1(y + r * .08)}" r="${r1(r * .58)}" fill="${INK}"/>`
          + `<circle cx="${r1(x + r * .02)}" cy="${r1(y - r * .26)}" r="${r1(r * .24)}" fill="#ffffff"/>`);
      },
      smile(a, b, cv = 2, teeth = null) {
        const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + cv];
        let s = '';
        if (teeth) {
          for (const u of teeth) {
            const px = (1 - u) ** 2 * a[0] + 2 * (1 - u) * u * m[0] + u * u * b[0];
            const py = (1 - u) ** 2 * a[1] + 2 * (1 - u) * u * m[1] + u * u * b[1];
            s += `<path d="M${r1(px - 2.2)} ${r1(py - 1)} L${r1(px)} ${r1(py + 3.6)} L${r1(px + 2.2)} ${r1(py - 1)}Z" fill="#ffffff" stroke="${C.ol}" stroke-width="1.4" stroke-linejoin="round"/>`;
          }
        }
        top.push(s + `<path d="M${pt(a)} Q${pt(m)} ${pt(b)}" fill="none" stroke="${C.ol}" stroke-width="2.6" stroke-linecap="round"/>`);
      },
      cheek(x, y) { top.push(`<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="5" ry="3.2" fill="#ff8fab" opacity=".45"/>`); },
      whiskers(x, y) {
        top.push(`<path d="M${x} ${y} l14 -4 M${x} ${y + 3} l15 1 M${x} ${y + 6} l13 5" stroke="${C.ol}" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>`);
      },
    };
    const scene = sceneOf(d);
    PLANS[d.plan](A, d.f);
    const rnd = seeded(d.name);
    const strong = !!d.f.acc;
    let pattern = '';
    if (box && (d.pattern === 'spots' || d.pattern === 'whitespots')) {
      const col = d.pattern === 'whitespots' ? '#ffffff' : C.accent;
      for (let i = 0; i < 8; i++) pattern += `<circle cx="${r1(box[0] + rnd() * (box[2] - box[0]))}" cy="${r1(box[1] + rnd() * (box[3] - box[1]))}" r="${r1(2.6 + rnd() * 3.2)}" fill="${col}" opacity="${strong || d.pattern === 'whitespots' ? .85 : .5}"/>`;
    } else if (box && d.pattern === 'stripes') {
      for (let x = box[0] + 6; x < box[2]; x += 15) pattern += `<path d="M${r1(x)} ${r1(box[1] - 14)} L${r1(x - 7)} ${r1(box[3] + 4)}" stroke="${C.accent}" stroke-width="6" stroke-linecap="round" opacity="${strong ? .85 : .42}"/>`;
    } else if (box && d.pattern === 'rings') {
      for (let i = 0; i < 7; i++) pattern += `<circle cx="${r1(box[0] + rnd() * (box[2] - box[0]))}" cy="${r1(box[1] + rnd() * (box[3] - box[1]))}" r="${r1(3.5 + rnd() * 2.5)}" fill="none" stroke="${C.belly}" stroke-width="2.2" opacity=".85"/>`;
    }
    return `<svg viewBox="0 0 240 170" aria-hidden="true" focusable="false">`
      + `<defs><clipPath id="${uid}">${sil.map(p => `<path d="${p}"/>`).join('')}</clipPath></defs>`
      + sceneSVG(scene, rnd)
      + `<g class="critter"><g transform="translate(${off[0]} ${off[1]})">${far.join('')}${back.join('')}${sil.length ? group(sil, C.body) : ''}`
      + `<g clip-path="url(#${uid})">${bellyD ? `<path d="${bellyD}" fill="${C.belly}"/>` : ''}${pattern}${clip.join('')}</g>`
      + `${near.join('')}${top.join('')}</g></g></svg>`;
  }

  // ---------- Page ----------

  const THEMES = [
    { bg: '#d4f3f1', rim: '#3cc4b8', dark: '#1f9488', accent: '#0c6f66' },
    { bg: '#dcebff', rim: '#5ea2f5', dark: '#2e74cf', accent: '#1d5fb8' },
    { bg: '#ffe4dc', rim: '#ff8a6b', dark: '#d95f3f', accent: '#b8432a' },
    { bg: '#fff1cf', rim: '#f2be4a', dark: '#c98f12', accent: '#8f6300' },
    { bg: '#ebe2ff', rim: '#9b7bf0', dark: '#6e4bd1', accent: '#5b37c4' },
    { bg: '#dff6e6', rim: '#5fcf8f', dark: '#2f9e62', accent: '#1d7a48' },
  ];
  const GAP_MS = 450;

  const $ = id => document.getElementById(id);
  const scene = $('scene'), cardsEl = $('cards'), strip = $('strip'), live = $('live');
  const titleEl = $('title'), subEl = $('sub'), blockEl = $('block'), blockLetter = $('blockLetter');
  const hintText = $('hintText'), soundBtn = $('soundBtn'), fsBtn = $('fsBtn');

  let current = [], currentLetter = null;

  function applyTheme(i) {
    const t = THEMES[i % THEMES.length], s = document.documentElement.style;
    s.setProperty('--bg', t.bg);
    s.setProperty('--rim', t.rim);
    s.setProperty('--rim-dark', t.dark);
    s.setProperty('--accent', t.accent);
  }

  function cardHTML(d, i) {
    const [sizeText, sizeIcon] = d.size, [homeText, homeIcon] = HOME[d.home];
    return `<button class="card" type="button" data-i="${i}" style="--i:${i}" aria-label="${d.name.replace(/"/g, '&quot;')}. ${d.fact}. ${homeText}. ${sizeText}.">`
      + `<span class="art ${sceneOf(d)}">${drawCreature(d, `c${i}`)}<span class="hear" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 9.5v5h4l5 4v-13l-5 4z" fill="currentColor"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.6 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></span>`
      + `<span class="info"><span class="name"><b>${d.name[0]}</b>${d.name.slice(1)}</span>`
      + (d.pron ? `<span class="say">${d.pron}</span>` : '')
      + `<span class="fact">${d.fact}</span>`
      + `<span class="chips"><span class="chip">${homeText} <i>${homeIcon}</i></span><span class="chip">${sizeText} <i>${sizeIcon}</i></span></span></span>`
      + `</button>`;
  }

  function showLetter(L, animate = true) {
    const i = LETTERS.indexOf(L);
    current = byLetter[L];
    applyTheme(i);
    scene.classList.toggle('still', !animate);
    blockLetter.textContent = L;
    if (animate) { blockEl.style.animation = 'none'; void blockEl.offsetWidth; blockEl.style.animation = ''; }
    titleEl.innerHTML = `Sea creatures that start with <b>${L}</b>`;
    subEl.textContent = `${current.length} to meet. Tap one to hear its name.`;
    cardsEl.innerHTML = current.map(cardHTML).join('');
    fitCards();
    scene.scrollTop = 0;
    live.textContent = `${L}: ${current.map(d => d.name).join(', ')}`;
    markKey(L, animate);
    if (animate) { chime(i); say(`${L}.`); }
  }

  // Pick the largest card size that fits this letter's creatures on one screen (scrolls if none does).
  // Rows are kept even (8 cards make 4 + 4, not 7 + 1).
  function fitCards() {
    const n = current.length;
    if (innerWidth <= 560 || !n) { cardsEl.style.removeProperty('--cw'); return; }
    const gap = 16, W = cardsEl.clientWidth;
    const H = scene.clientHeight - scene.querySelector('.head').offsetHeight - 40;
    const widthFor = rows => { const cols = Math.ceil(n / rows); return Math.min(236, Math.floor((W - (cols - 1) * gap) / cols)); };
    const tallest = () => Math.max(...[...cardsEl.children].map(c => c.offsetHeight));
    for (let rows = 1; rows <= n; rows++) {
      const w = widthFor(rows);
      if (w < 150) continue;
      cardsEl.style.setProperty('--cw', w + 'px');
      if (rows * tallest() + (rows - 1) * gap <= H) return;
    }
    const rows = Math.ceil(n / Math.min(n, Math.max(1, Math.floor((W + gap) / (200 + gap)))));
    cardsEl.style.setProperty('--cw', Math.max(150, widthFor(rows)) + 'px');
  }
  let fitFrame = 0;
  addEventListener('resize', () => { cancelAnimationFrame(fitFrame); fitFrame = requestAnimationFrame(fitCards); });

  let talkTimer = 0;
  function talk(card) {
    const d = current[+card.dataset.i];
    if (!d) return;
    for (const c of cardsEl.querySelectorAll('.card.now')) c.classList.remove('now');
    card.classList.remove('talk');
    void card.offsetWidth;
    card.classList.add('talk', 'now');
    clearTimeout(talkTimer);
    talkTimer = setTimeout(() => card.classList.remove('talk'), 850);
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    chime(+card.dataset.i + 2, .5);
    say(d.say, .8);
    live.textContent = d.name;
  }

  const randomLetter = () => {
    let L;
    do L = LETTERS[Math.floor(Math.random() * 26)]; while (L === currentLetter);
    return L;
  };

  // ---------- Alphabet strip ----------

  const keys = {};
  [...LETTERS].forEach((L, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key';
    b.textContent = L;
    b.setAttribute('aria-label', `Sea creatures that start with ${L}`);
    b.style.setProperty('--c', THEMES[i % THEMES.length].rim);
    b.addEventListener('click', () => trigger(() => showLetter(L)));
    strip.append(b);
    keys[L] = b;
  });

  function markKey(L, seen = true) {
    if (currentLetter) keys[currentLetter].classList.remove('now');
    currentLetter = L;
    keys[L].classList.add('now');
    if (seen) keys[L].classList.add('seen');
  }

  // ---------- Sound ----------

  let soundOn = true;
  try { soundOn = localStorage.getItem('ocean-sound') !== 'off'; } catch {}
  let actx = null;

  function chime(i, octave = 1) {
    if (!soundOn || !actx) return;
    try {
      const steps = [0, 2, 4, 7, 9];
      const semi = steps[i % 5] + 12 * (Math.floor(i / 5) % 2);
      const f = 392 * octave * Math.pow(2, semi / 12);
      const t = actx.currentTime;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      g.connect(actx.destination);
      for (const [mult, type, level] of [[1, 'triangle', 1], [2, 'sine', 0.3]]) {
        const o = actx.createOscillator(), og = actx.createGain();
        o.type = type;
        o.frequency.value = f * mult;
        og.gain.value = level;
        o.connect(og).connect(g);
        o.start(t);
        o.stop(t + 0.65);
      }
    } catch {}
  }

  const canSpeak = 'speechSynthesis' in window;
  let voice = null, speakTimer = 0;
  function pickVoice() {
    try {
      const en = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang));
      voice = en.find(v => /Samantha|Google US English|Aria|Jenny|Ava|Karen|Serena/i.test(v.name))
        || en.find(v => v.default) || en[0] || null;
    } catch {}
  }
  if (canSpeak) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  function say(text, rate = 0.85) {
    if (!soundOn || !canSpeak) return;
    clearTimeout(speakTimer);
    try { speechSynthesis.cancel(); } catch {}
    speakTimer = setTimeout(() => {
      try {
        const u = new SpeechSynthesisUtterance(text);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
        u.rate = rate;
        u.pitch = 1.15;
        speechSynthesis.speak(u);
      } catch {}
    }, 200);
  }

  function setSound(on) {
    soundOn = on;
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.querySelector('span').textContent = on ? 'Sound on' : 'Sound off';
    if (!on && canSpeak) { clearTimeout(speakTimer); try { speechSynthesis.cancel(); } catch {} }
    try { localStorage.setItem('ocean-sound', on ? 'on' : 'off'); } catch {}
  }
  soundBtn.addEventListener('click', () => { wake(); setSound(!soundOn); });
  setSound(soundOn);

  // ---------- Input ----------

  let lastAt = 0, lastTalk = 0, wakeLock = null;

  function wake() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    if (!wakeLock && navigator.wakeLock) {
      navigator.wakeLock.request('screen').then(l => {
        wakeLock = l;
        l.addEventListener('release', () => { wakeLock = null; });
      }).catch(() => {});
    }
  }

  function trigger(fn) {
    const now = performance.now();
    if (now - lastAt < GAP_MS) return;
    lastAt = now;
    wake();
    fn();
  }

  function talkTo(card) {
    const now = performance.now();
    if (!card || now - lastTalk < 250) return;
    lastTalk = now;
    wake();
    card.focus({ preventScroll: true });
    talk(card);
  }

  cardsEl.addEventListener('click', e => talkTo(e.target.closest('.card')));

  addEventListener('keydown', e => {
    if (/^F\d{1,2}$/.test(e.key)) return; // leave F5 / F11 for grown-ups
    e.preventDefault();
    if (e.repeat) return;
    const ch = e.key && e.key.length === 1 ? e.key.toUpperCase() : '';
    const cards = [...cardsEl.querySelectorAll('.card')];
    const at = cards.indexOf(document.activeElement);
    let m;
    if (/^[A-Z]$/.test(ch)) trigger(() => showLetter(ch));
    else if ((m = /^Key([A-Z])$/.exec(e.code))) trigger(() => showLetter(m[1]));
    else if (/^[0-9]$/.test(ch)) talkTo(cards[ch === '0' ? 9 : +ch - 1]);
    else if ((m = /^(?:Digit|Numpad)([0-9])$/.exec(e.code))) talkTo(cards[m[1] === '0' ? 9 : +m[1] - 1]);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') talkTo(cards[(at + 1) % cards.length]);
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') talkTo(cards[(at - 1 + cards.length) % cards.length]);
    else if ((e.key === 'Enter' || e.key === ' ') && at >= 0) talkTo(cards[at]);
    else trigger(() => showLetter(randomLetter())); // other keys still do something
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  function syncFocus() {
    const focused = document.hasFocus();
    document.body.classList.toggle('away', !focused);
    hintText.textContent = focused ? 'Press a letter, then tap a sea creature' : 'Tap or click to start';
  }
  addEventListener('focus', syncFocus);
  addEventListener('blur', syncFocus);
  syncFocus();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && lastAt) wake();
  });

  // ---------- Full screen ----------

  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  fsBtn.addEventListener('click', async () => {
    wake();
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else {
        await document.documentElement.requestFullscreen();
        try { await navigator.keyboard?.lock?.(); } catch {}
      }
    } catch {}
  });
  document.addEventListener('fullscreenchange', () => {
    const on = !!document.fullscreenElement;
    fsBtn.setAttribute('aria-pressed', String(on));
    fsBtn.querySelector('span').textContent = on ? 'Exit full screen' : 'Full screen';
  });

  showLetter('O', false);
  window.__ocean = { CREATURES, drawCreature, byLetter, sceneOf }; // used by the preview-image script
})();
</script>
</body>
</html>
