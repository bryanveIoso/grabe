<style>
/* Layout: one full-screen play mat. An ABC block and its picture sit side by side
   (stacked when the screen is tall), the word goes underneath, the alphabet runs along the bottom.
   Single bright theme on purpose: the background changes colour with every letter. */
:root {
  --ink: #2d2440;
  --ink-soft: #625a76;
  --face: #fffdf8;
  --bg: #ffe3ea;
  --rim: #ff7a9c;
  --rim-dark: #d94a70;
  --accent: #c2255c;
  --rim2: #4ccb94;
  --rim2-dark: #229c68;
  --accent2: #0f7a50;
  --shadow: rgba(45, 36, 64, .18);
  --font-display: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-ui: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --bs: min(34vmin, 300px);
  --ps: min(40vmin, 340px);
  color-scheme: light;
}

html {
  box-sizing: border-box;
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  transition: background-color .5s ease;
}
*, *::before, *::after { box-sizing: inherit; }

body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  transition: background-color .5s ease;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
}

.stage {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px;
}

/* Top bar */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
}
.hint {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  font: 800 clamp(13px, 1.7vmin, 16px)/1.2 var(--font-ui);
  color: var(--ink-soft);
  transition: background-color .3s, color .3s;
}
.hint kbd {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--face);
  box-shadow: 0 3px 0 var(--rim-dark);
  font: 600 16px/1 var(--font-display);
  color: var(--accent);
}
.away .hint {
  background: var(--ink);
  color: var(--face);
  animation: nudge 1.6s ease-in-out infinite;
}
.controls { display: flex; gap: 8px; flex: none; }
.ctrl {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 16px 0 12px;
  border: 0;
  border-radius: 999px;
  background: color-mix(in srgb, var(--face) 72%, transparent);
  color: var(--ink);
  font: 800 14px/1 var(--font-ui);
  cursor: pointer;
}
.ctrl:hover { background: var(--face); }
.ctrl svg { width: 22px; height: 22px; flex: none; }
.ctrl .off, .ctrl[aria-pressed="false"] .on { display: none; }
.ctrl[aria-pressed="false"] .off { display: inline; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* Scene */
.scene {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 1.6vmin, 18px);
  min-height: 0;
  text-align: center;
}
.art {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(24px, 7vmin, 96px);
}

.blocks { position: relative; flex: none; }
.blocks.pair { padding: 0 calc(var(--bs) * .3) calc(var(--bs) * .22) 0; }

/* A wooden alphabet block: painted rim, cream face, an engraved inner frame */
.block {
  --s: var(--bs);
  --r: var(--rim);
  --rd: var(--rim-dark);
  position: relative;
  display: grid;
  place-items: center;
  width: var(--s);
  height: var(--s);
  border-radius: calc(var(--s) * .16);
  background: var(--face);
  box-shadow:
    inset 0 0 0 calc(var(--s) * .065) var(--r),
    0 calc(var(--s) * .055) 0 var(--rd),
    0 calc(var(--s) * .1) calc(var(--s) * .09) var(--shadow);
  color: var(--accent);
  font-family: var(--font-display);
  font-weight: 600;
}
.block::before {
  content: "";
  position: absolute;
  inset: calc(var(--s) * .13);
  border-radius: calc(var(--s) * .07);
  border: calc(var(--s) * .014) solid color-mix(in srgb, var(--r) 45%, transparent);
}
.block span {
  position: relative;
  font-size: calc(var(--s) * .64);
  line-height: 1;
}
.block.small {
  --s: calc(var(--bs) * .48);
  --r: var(--rim2);
  --rd: var(--rim2-dark);
  position: absolute;
  right: 0;
  bottom: 0;
  color: var(--accent2);
  transform: rotate(9deg);
}

.pic {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  justify-content: center;
  width: var(--ps);
  height: var(--ps);
  flex: none;
}
.pic.solo::after {
  content: "";
  position: absolute;
  left: 24%;
  right: 24%;
  bottom: 3%;
  height: 7%;
  border-radius: 50%;
  background: var(--shadow);
  filter: blur(3px);
}
.item {
  position: relative;
  z-index: 1;
  width: calc(100% / var(--cols));
  font-family: var(--font-emoji);
  font-size: calc(var(--ps) / var(--cols) * .72);
  line-height: 1.15;
}

.lead {
  margin: 0;
  font: 500 clamp(18px, 3.4vmin, 34px)/1.1 var(--font-display);
  color: var(--ink-soft);
}
.word {
  margin: 0;
  max-width: 100%;
  font: 600 clamp(44px, 10vmin, 132px)/1 var(--font-display);
  letter-spacing: -.01em;
  color: var(--ink);
  text-wrap: balance;
}
.lead b, .word b { color: var(--accent); font-weight: 700; }

/* Entrance: the block pops, the little block tumbles in, the picture drops and settles */
.big { animation: pop .55s cubic-bezier(.3, 1.5, .5, 1) both; }
.small { animation: tumble .7s .1s cubic-bezier(.3, 1.3, .5, 1) both; }
.item { animation: drop .65s calc(var(--d) * 110ms + .08s) both; }
.pic.solo .item { animation: drop .65s .08s both, bob 2.8s .75s ease-in-out infinite; }
.lead, .word { animation: rise .45s .18s cubic-bezier(.2, .9, .3, 1) both; }
.still .big, .still .small, .still .item, .still .lead, .still .word { animation: none; }
.still .pic.solo .item { animation: bob 2.8s ease-in-out infinite; }

@keyframes pop {
  from { transform: scale(.3) rotate(-14deg); opacity: 0; }
  60% { transform: scale(1.08) rotate(3deg); opacity: 1; }
  to { transform: none; }
}
@keyframes tumble {
  from { transform: translate(40%, -70%) rotate(-50deg) scale(.5); opacity: 0; }
  65% { transform: translate(0, 4%) rotate(15deg); opacity: 1; }
  to { transform: rotate(9deg); }
}
@keyframes drop {
  from { transform: translateY(-45%) scale(.5); opacity: 0; }
  55% { transform: translateY(5%) scale(1.08, .92); opacity: 1; }
  78% { transform: translateY(-4%) scale(.97, 1.03); }
  to { transform: none; }
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-4%) rotate(-3deg); }
}
@keyframes rise {
  from { transform: translateY(30%); opacity: 0; }
  to { transform: none; opacity: 1; }
}
@keyframes nudge {
  0%, 100% { transform: none; }
  50% { transform: scale(1.04); }
}
@keyframes fade { from { opacity: 0; } }

/* Alphabet strip */
.strip {
  --kg: 4px;
  --k: min(42px, calc((100vw - 32px - 25 * var(--kg)) / 26));
  display: grid;
  grid-template-columns: repeat(26, var(--k));
  gap: var(--kg);
  justify-content: center;
}
.key {
  width: var(--k);
  height: var(--k);
  padding: 0;
  border: 2px solid color-mix(in srgb, var(--ink) 14%, transparent);
  border-radius: 30%;
  background: transparent;
  color: color-mix(in srgb, var(--ink) 55%, transparent);
  font: 600 calc(var(--k) * .5)/1 var(--font-display);
  cursor: pointer;
  transition: background-color .3s, color .3s, transform .2s;
}
.key.seen { background: var(--c); border-color: transparent; color: var(--ink); }
.key.now { transform: translateY(-4px); border-color: var(--ink); }

.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.sr { position: absolute; top: 0; left: 0; margin: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (orientation: portrait) {
  :root {
    --bs: min(23vh, 48vw, 300px);
    --ps: min(21vh, 52vw, 300px);
  }
  @supports (height: 1svh) {
    :root {
      --bs: min(23svh, 48vw, 300px);
      --ps: min(21svh, 52vw, 300px);
    }
  }
  .art { flex-direction: column; gap: clamp(14px, 3vh, 36px); }
  .word { font-size: clamp(40px, 12vw, 104px); }
}
@media (max-width: 820px) {
  .strip {
    --k: min(40px, calc((100vw - 32px - 12 * var(--kg)) / 13));
    grid-template-columns: repeat(13, var(--k));
  }
}
@media (max-width: 520px) {
  .ctrl { padding: 0; width: 44px; justify-content: center; }
  .ctrl span { display: none; }
}
@media (max-height: 460px) {
  .strip { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .scene *, .still .pic.solo .item, .away .hint { animation: fade .3s both !important; }
  .block.small { transform: rotate(9deg); }
}
</style>
</head>

      |Baby 👶|Monkey 🐵|Butterfly 🦋|Bunny 🐰|Happy 😊|Key 🔑|Turkey 🦃|Donkey 🫏|Puppy 🐕|Pony 🐴|Daisy 🌼
      |Candy 🍬|Honey 🍯|Party 🎉|Teddy 🧸|Crayon 🖍️|Sky 🌤️|Strawberry 🍓|Cherry 🍒|Family 👪|Bicycle 🚲`,
    Z: `Zebra 🦓|Zzz 💤|Zero 0️⃣|Zipper 🤐|Zucchini 🥒|Zigzag ⚡|Zoo 🦁|Zoom 🚀|Zany 🤪|Pizza 🍕|Puzzle 🧩

  };
  // How some words should be spoken aloud.
  const SAY = {
    'Zzz': 'z z z. Sleepy time', 'Quiet': 'quiet. Shhh', 'Quack': 'quack quack', 'T. rex': 'T rex', 'UFO': 'U F O',
    'TV': 'T V', 'Buzz': 'buzz buzz', 'Woof': 'woof woof', 'Vroom': 'vroom vroom', 'Squeak': 'squeak squeak',
  };

  // Things to count for 1-9, written as "picture one/many".
  const COUNTABLES = ('⭐ star/stars|🐞 ladybug/ladybugs|🍓 strawberry/strawberries|🐥 chick/chicks|🎈 balloon/balloons|'
    + '🍪 cookie/cookies|🐟 fish/fish|🌸 flower/flowers|🚗 car/cars|🦆 duck/ducks|🍎 apple/apples|🍌 banana/bananas|'
    + '🦋 butterfly/butterflies|🐸 frog/frogs|🐝 bee/bees|❤️ heart/hearts|⚽ ball/balls|🧁 cupcake/cupcakes|'
    + '🐢 turtle/turtles|🦀 crab/crabs|⛵ boat/boats|🐰 bunny/bunnies|🐷 pig/pigs|🥕 carrot/carrots')
    .split('|').map(s => {
      const [e, names] = s.split(' ');
      const [one, many] = names.split('/');
      return { e, one, many };
    });
  // Zero is round, like one of these.
  const ROUND = 'donut 🍩|ball ⚽|orange 🍊|cookie 🍪|wheel 🛞|bagel 🥯|full moon 🌕|coin 🪙|ring 💍|basketball 🏀|tomato 🍅|clock 🕒';
  const NUMBERS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];

  const THEMES = [
    { bg: '#ffe3ea', rim: '#ff7a9c', dark: '#d94a70', accent: '#c2255c' },
    { bg: '#fff3c4', rim: '#ffc93c', dark: '#d99a00', accent: '#a86200' },
    { bg: '#d7f5e7', rim: '#4ccb94', dark: '#229c68', accent: '#0f7a50' },
    { bg: '#dcebff', rim: '#5ea2f5', dark: '#2e74cf', accent: '#1d5fb8' },
    { bg: '#ebe2ff', rim: '#9b7bf0', dark: '#6e4bd1', accent: '#5b37c4' },
    { bg: '#ffe4d1', rim: '#ff9152', dark: '#db6420', accent: '#c04f0e' },
  ];

  const GAP_MS = 450; // ignore key mashing faster than this

  const $ = id => document.getElementById(id);
  const scene = $('scene'), live = $('live'), strip = $('strip');
  const hintText = $('hintText'), soundBtn = $('soundBtn'), fsBtn = $('fsBtn');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

  const parseList = str => str.split('|').map(s => s.trim()).filter(Boolean).map(s => {
    const at = s.lastIndexOf(' ');
    return { word: s.slice(0, at), emoji: s.slice(at + 1) };
  });
  const entries = {};
  for (const L of LETTERS) entries[L] = parseList(WORDS[L]);
  const roundThings = parseList(ROUND);
  const lastPick = {};
  const pick = (list, key) => {
    let k = Math.floor(Math.random() * list.length);
    if (list.length > 1 && k === lastPick[key]) k = (k + 1) % list.length;
    lastPick[key] = k;
    return list[k];
  };

  // ---------- Drawing ----------

  function applyTheme(i) {
    const t = THEMES[i % THEMES.length];
    const t2 = THEMES[(i + 2) % THEMES.length];
    const s = document.documentElement.style;
    s.setProperty('--bg', t.bg);
    s.setProperty('--rim', t.rim);
    s.setProperty('--rim-dark', t.dark);
    s.setProperty('--accent', t.accent);
    s.setProperty('--rim2', t2.rim);
    s.setProperty('--rim2-dark', t2.dark);
    s.setProperty('--accent2', t2.accent);
    return [t.rim, t2.rim, t.accent, t2.dark];
  }

  function mark(word, L) {
    const i = word.toLowerCase().indexOf(L.toLowerCase());
    if (i < 0) return word;
    return `${word.slice(0, i)}<b>${word[i]}</b>${word.slice(i + 1)}`;
  }

  function draw(s) {
    const colors = applyTheme(s.theme);
    const n = s.items.length;
    const cols = n === 1 ? 1 : n <= 4 ? 2 : 3;
    scene.classList.toggle('still', !s.animate);
    scene.innerHTML = `
      <div class="art">
        <div class="blocks${s.small ? ' pair' : ''}">
          <div class="block big"><span>${s.glyph}</span></div>
          ${s.small ? `<div class="block small"><span>${s.small}</span></div>` : ''}
        </div>
        <div class="pic${n === 1 ? ' solo' : ''}" style="--cols:${cols}" aria-hidden="true">
          ${s.items.map((e, j) => `<span class="item" style="--d:${j}">${e}</span>`).join('')}
        </div>
      </div>
      <p class="lead">${s.lead}</p>
      <p class="word">${s.word}</p>`;
    live.textContent = s.label;
    if (s.animate) {
      burst(colors);
      chime(s.theme);
      say(s.speech);
    }
  }

  function showLetter(L, animate = true, forced) {
    const i = LETTERS.indexOf(L);
    const { word, emoji } = forced || pick(entries[L], L);
    const rel = word[0].toUpperCase() === L ? 'for' : 'in';
    const spoken = SAY[word] || word.toLowerCase();
    draw({
      theme: i,
      glyph: L,
      small: L.toLowerCase(),
      items: [emoji],
      lead: `<b>${L}</b> is ${rel}`,
      word: mark(word, L),
      label: `${L} is ${rel} ${word}`,
      speech: `${L} is ${rel} ${spoken}.`,
      animate,
    });
    markKey(L, animate);
  }

  function showNumber(n) {
    if (n === 0) {
      const { word: thing, emoji } = pick(roundThings, 'round');
      const like = /^[aeiou]/.test(thing) ? 'like an' : 'like a';
      draw({
        theme: 0, glyph: '0', small: '', items: [emoji],
        lead: 'Zero is round', word: `${like} <b>${thing}</b>`,
        label: `Zero is round ${like} ${thing}`,
        speech: `Zero is round, ${like} ${thing}.`,
        animate: true,
      });
    } else {
      const c = pick(COUNTABLES, 'count');
      const noun = n === 1 ? c.one : c.many;
      draw({
        theme: n, glyph: String(n), small: '', items: Array(n).fill(c.e),
        lead: 'Let’s count', word: `<b>${NUMBERS[n]}</b> ${noun}`,
        label: `${n} ${noun}`,
        speech: `${NUMBERS[n]} ${noun}!`,
        animate: true,
      });
    }
    markKey(null);
  }

  const randomLetter = () => {
    let L;
    do L = LETTERS[Math.floor(Math.random() * 26)]; while (L === currentLetter);
    return L;
  };

  // ---------- Alphabet strip ----------

  const keys = {};
  let currentLetter = null;
  [...LETTERS].forEach((L, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key';
    b.textContent = L;
    b.setAttribute('aria-label', `Show ${L}`);
    b.style.setProperty('--c', THEMES[i % THEMES.length].rim);
    b.addEventListener('click', () => trigger(() => showLetter(L)));
    strip.append(b);
    keys[L] = b;
  });

  function markKey(L, seen = true) {
    if (currentLetter) keys[currentLetter].classList.remove('now');
    currentLetter = L;
    if (!L) return;
    keys[L].classList.add('now');
    if (seen) keys[L].classList.add('seen');
  }

  // ---------- Sound: a little chime, then the words read aloud ----------

  let soundOn = true;
  try { soundOn = localStorage.getItem('abc-sound') !== 'off'; } catch {}
  let actx = null;

  function chime(i) {
    if (!soundOn || !actx) return;
    try {
      const steps = [0, 2, 4, 7, 9]; // pentatonic, so any run of presses sounds pleasant
      const semi = steps[i % 5] + 12 * (Math.floor(i / 5) % 2);
      const f = 392 * Math.pow(2, semi / 12);
      const t = actx.currentTime;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      g.connect(actx.destination);
      for (const [mult, type, level] of [[1, 'triangle', 1], [2, 'sine', 0.35]]) {
        const o = actx.createOscillator();
        const og = actx.createGain();
        o.type = type;
        o.frequency.value = f * mult;
        og.gain.value = level;
        o.connect(og).connect(g);
        o.start(t);
        o.stop(t + 0.75);
      }
    } catch {}
  }

  const canSpeak = 'speechSynthesis' in window;
  let voice = null, speakTimer = 0;
  function pickVoice() {
    try {
      const en = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang));
      voice = en.find(v => /Samantha|Google US English|Aria|Jenny|Ava|Karen|Serena/i.test(v.name))
        || en.find(v => v.default) || en[0] || null;
    } catch {}
  }
  if (canSpeak) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  function say(text) {
    if (!soundOn || !canSpeak) return;
    clearTimeout(speakTimer);
    try { speechSynthesis.cancel(); } catch {}
    speakTimer = setTimeout(() => {
      try {
        const u = new SpeechSynthesisUtterance(text);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
        u.rate = 0.85;
        u.pitch = 1.15;
        speechSynthesis.speak(u);
      } catch {}
    }, 220);
  }

  function setSound(on) {
    soundOn = on;
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.querySelector('span').textContent = on ? 'Sound on' : 'Sound off';
    if (!on && canSpeak) { clearTimeout(speakTimer); try { speechSynthesis.cancel(); } catch {} }
    try { localStorage.setItem('abc-sound', on ? 'on' : 'off'); } catch {}
  }
  soundBtn.addEventListener('click', () => { wake(); setSound(!soundOn); });
  setSound(soundOn);

  // ---------- Confetti ----------

  const fx = $('fx'), ctx = fx.getContext('2d');
  let parts = [], raf = 0, lastFrame = 0;

  function sizeFx() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    fx.width = innerWidth * d;
    fx.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', sizeFx);
  sizeFx();

  function burst(colors) {
    if (reduceMotion.matches) return;
    const big = scene.querySelector('.big');
    if (!big) return;
    const r = big.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let k = 0; k < 34; k++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 7;
      parts.push({
        x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3,
        size: 6 + Math.random() * 8, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
        color: colors[k % colors.length], shape: k % 3, life: 1,
      });
    }
    parts = parts.slice(-160);
    if (!raf) { lastFrame = performance.now(); raf = requestAnimationFrame(tick); }
  }

  function star(r) {
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const rr = k % 2 ? r * 0.45 : r;
      const a = k * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
  }

  function tick(now) {
    const dt = Math.min((now - lastFrame) / 16.7, 3);
    lastFrame = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vy += 0.25 * dt;
      p.vx *= Math.pow(0.985, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.life -= 0.016 * dt;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 0) { ctx.beginPath(); ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2); ctx.fill(); }
      else if (p.shape === 1) ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
      else star(p.size * 0.75);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }

  // ---------- Input ----------

  let lastAt = 0, wakeLock = null;

  function wake() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    if (!wakeLock && navigator.wakeLock) {
      navigator.wakeLock.request('screen').then(l => {
        wakeLock = l;
        l.addEventListener('release', () => { wakeLock = null; });
      }).catch(() => {});
    }
  }

  function trigger(fn) {
    const now = performance.now();
    if (now - lastAt < GAP_MS) return;
    lastAt = now;
    wake();
    fn();
  }

  addEventListener('keydown', e => {
    if (/^F\d{1,2}$/.test(e.key)) return; // leave F5 / F11 for grown-ups
    e.preventDefault();
    if (e.repeat) return;
    const ch = e.key && e.key.length === 1 ? e.key.toUpperCase() : '';
    let m;
    if (/^[A-Z]$/.test(ch)) trigger(() => showLetter(ch));
    else if (/^[0-9]$/.test(ch)) trigger(() => showNumber(+ch));
    else if ((m = /^Key([A-Z])$/.exec(e.code))) trigger(() => showLetter(m[1]));
    else if ((m = /^(?:Digit|Numpad)([0-9])$/.exec(e.code))) trigger(() => showNumber(+m[1]));
    else trigger(() => showLetter(randomLetter())); // space, arrows, shift... still do something
  });

  document.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    trigger(() => showLetter(randomLetter()));
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  function syncFocus() {
    const focused = document.hasFocus();
    document.body.classList.toggle('away', !focused);
    hintText.textContent = focused ? 'Press any key or tap anywhere' : 'Tap or click to start';
  }
  addEventListener('focus', syncFocus);
  addEventListener('blur', syncFocus);
  syncFocus();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && lastAt) wake();
  });

  // ---------- Full screen ----------

  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  fsBtn.addEventListener('click', async () => {
    wake();
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else {
        await document.documentElement.requestFullscreen();
        // Where supported, also capture Esc and other system keys so little hands stay in the game.
        try { await navigator.keyboard?.lock?.(); } catch {}
      }
    } catch {}
  });
  document.addEventListener('fullscreenchange', () => {
    const on = !!document.fullscreenElement;
    fsBtn.setAttribute('aria-pressed', String(on));
    fsBtn.querySelector('span').textContent = on ? 'Exit full screen' : 'Full screen';
  });

  showLetter('A', false, entries.A[0]);
})();
</script>
</body>
</html>
