<style>
/* Layout: a letter block and a heading on top, a wrap of dinosaur cards below (scrolls when
   a letter has many), the alphabet along the bottom. Single bright theme: the background
   changes colour with each letter, like the A is for Apple game. */
:root {
  --ink: #2d2440;
  --ink-soft: #625a76;
  --face: #fffdf8;
  --bg: #d7f5e7;
  --rim: #4ccb94;
  --rim-dark: #229c68;
  --accent: #0f7a50;
  --shadow: rgba(45, 36, 64, .16);
  --land: #fff5e1;
  --sky: #e3f0ff;
  --sea: #cbe7fb;
  --sea-deep: #9fd0f1;
  --font-display: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-ui: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: light;
}

html {
  box-sizing: border-box;
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  transition: background-color .5s ease;
}
*, *::before, *::after { box-sizing: inherit; }

body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  transition: background-color .5s ease;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.stage {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px;
}

/* Top bar */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
}
.hint {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  margin: 0;
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  font: 800 clamp(13px, 1.7vmin, 16px)/1.2 var(--font-ui);
  color: var(--ink-soft);
  transition: background-color .3s, color .3s;
}
.hint kbd {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--face);
  box-shadow: 0 3px 0 var(--rim-dark);
  font: 600 16px/1 var(--font-display);
  color: var(--accent);
}
.away .hint {
  background: var(--ink);
  color: var(--face);
  animation: nudge 1.6s ease-in-out infinite;
}
.controls { display: flex; gap: 8px; flex: none; }
.ctrl {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 16px 0 12px;
  border: 0;
  border-radius: 999px;
  background: color-mix(in srgb, var(--face) 72%, transparent);
  color: var(--ink);
  font: 800 14px/1 var(--font-ui);
  cursor: pointer;
}
.ctrl:hover { background: var(--face); }
.ctrl svg { width: 22px; height: 22px; flex: none; }
.ctrl .off, .ctrl[aria-pressed="false"] .on { display: none; }
.ctrl[aria-pressed="false"] .off { display: inline; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* Scene */
.scene {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 2.4vmin, 22px);
  padding: 6px 4px 14px;
}
.head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 2.6vmin, 24px);
}
.head h1 {
  margin: 0;
  font: 600 clamp(22px, 4.4vmin, 42px)/1.05 var(--font-display);
  color: var(--ink);
  text-wrap: balance;
}
.head h1 b { color: var(--accent); font-weight: 700; }
.head p {
  margin: 6px 0 0;
  font: 700 clamp(13px, 1.9vmin, 17px)/1.3 var(--font-ui);
  color: var(--ink-soft);
}

/* A wooden alphabet block, as in the ABC game */
.block {
  --s: clamp(64px, 12vmin, 104px);
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
  width: var(--s);
  height: var(--s);
  border-radius: calc(var(--s) * .16);
  background: var(--face);
  box-shadow:
    inset 0 0 0 calc(var(--s) * .065) var(--rim),
    0 calc(var(--s) * .055) 0 var(--rim-dark),
    0 calc(var(--s) * .1) calc(var(--s) * .09) var(--shadow);
  font: 600 calc(var(--s) * .64)/1 var(--font-display);
  color: var(--accent);
}
.block::before {
  content: "";
  position: absolute;
  inset: calc(var(--s) * .13);
  border-radius: calc(var(--s) * .07);
  border: calc(var(--s) * .014) solid color-mix(in srgb, var(--rim) 45%, transparent);
}
.block span { position: relative; }

/* Dinosaur cards */
.cards {
  --cw: clamp(160px, 19vw, 236px);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 16px;
}
.card {
  container-type: inline-size;
  display: flex;
  flex-direction: column;
  flex: none;
  width: var(--cw);
  padding: 0;
  border: 0;
  border-radius: 22px;
  overflow: hidden;
  background: var(--face);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--rim-dark) 45%, transparent), 0 10px 22px var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
  animation: cardIn .45s calc(var(--i) * 60ms) cubic-bezier(.3, 1.4, .5, 1) both;
}
.card:hover { transform: translateY(-3px); }
.card:active { transform: translateY(2px); }
.card.now { box-shadow: 0 0 0 4px var(--rim), 0 4px 0 4px var(--rim-dark), 0 10px 22px var(--shadow); }
.art {
  position: relative;
  display: block;
  aspect-ratio: 240 / 170;
  background: var(--land);
}
.art.sky { background: var(--sky); }
.art.sea { background: linear-gradient(var(--sea), var(--sea-deep)); }
.art svg { display: block; width: 100%; height: 100%; }
.hear {
  position: absolute;
  top: 8px;
  left: 8px;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--face) 85%, transparent);
  color: var(--ink);
}
.hear svg { width: 18px; height: 18px; }
.info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 10px 14px 14px;
}
.name {
  font: 600 clamp(16px, 9.2cqi, 23px)/1.1 var(--font-display);
  color: var(--ink);
}
.name b { color: var(--accent); font-weight: 700; }
.say {
  font: 800 12px/1.25 var(--font-ui);
  letter-spacing: .03em;
  color: var(--ink-soft);
}
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip {
  padding: 5px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--rim) 20%, var(--face));
  font: 800 11.5px/1.1 var(--font-ui);
  color: var(--ink);
}
.chip i { font-style: normal; font-family: var(--font-emoji); }

.dino {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: breathe 3.4s calc(var(--i) * -.7s) ease-in-out infinite;
}
.card.talk .dino { animation: hop .8s cubic-bezier(.3, 1.4, .5, 1); }
.still .card { animation: none; }

@keyframes cardIn {
  from { transform: translateY(24px) scale(.85); opacity: 0; }
  to { transform: none; opacity: 1; }
}
@keyframes breathe {
  0%, 100% { transform: none; }
  50% { transform: scale(1.012, .985); }
}
@keyframes hop {
  0% { transform: none; }
  25% { transform: translateY(2%) scale(1.06, .9); }
  55% { transform: translateY(-12%) scale(.96, 1.06); }
  80% { transform: translateY(1%) scale(1.04, .95); }
  100% { transform: none; }
}
@keyframes pop {
  from { transform: scale(.3) rotate(-14deg); opacity: 0; }
  60% { transform: scale(1.08) rotate(3deg); opacity: 1; }
  to { transform: none; }
}
@keyframes nudge {
  0%, 100% { transform: none; }
  50% { transform: scale(1.04); }
}
@keyframes fade { from { opacity: 0; } }
.head .block { animation: pop .55s cubic-bezier(.3, 1.5, .5, 1) both; }
.still .head .block { animation: none; }

/* Alphabet strip */
.strip {
  --kg: 4px;
  --k: min(42px, calc((100vw - 32px - 25 * var(--kg)) / 26));
  display: grid;
  grid-template-columns: repeat(26, var(--k));
  gap: var(--kg);
  justify-content: center;
}
.key {
  width: var(--k);
  height: var(--k);
  padding: 0;
  border: 2px solid color-mix(in srgb, var(--ink) 14%, transparent);
  border-radius: 30%;
  background: transparent;
  color: color-mix(in srgb, var(--ink) 55%, transparent);
  font: 600 calc(var(--k) * .5)/1 var(--font-display);
  cursor: pointer;
  transition: background-color .3s, color .3s, transform .2s;
}
.key.seen { background: var(--c); border-color: transparent; color: var(--ink); }
.key.now { transform: translateY(-4px); border-color: var(--ink); }

.sr { position: absolute; top: 0; left: 0; margin: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 820px) {
  .strip {
    --k: min(40px, calc((100vw - 32px - 12 * var(--kg)) / 13));
    grid-template-columns: repeat(13, var(--k));
  }
}
@media (max-width: 560px) {
  .cards { --cw: calc((100vw - 32px - 20px) / 2); gap: 12px; }
  .info { padding: 8px 10px 12px; }
  .say { font-size: 11px; }
  .chip { font-size: 10.5px; padding: 4px 7px; }
  .ctrl { padding: 0; width: 44px; justify-content: center; }
  .ctrl span { display: none; }
}
@media (max-height: 460px) {
  .strip { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .head .block, .dino, .card.talk .dino, .away .hint { animation: fade .3s both !important; }
}
</style>
</head>

  function mix(a, b, t) {

    const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);

  // Closed (or open) Catmull-Rom curve through the points.
  function smooth(p, closed = true) {

    let d = `M${r1(p[0][0])} ${r1(p[0][1])}`;
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const a = g(i - 1), b = g(i), c = g(i + 1), e = g(i + 2);
      d += `C${r1(b[0] + (c[0] - a[0]) / 6)} ${r1(b[1] + (c[1] - a[1]) / 6)} ${r1(c[0] - (e[0] - b[0]) / 6)} ${r1(c[1] - (e[1] - b[1]) / 6)} ${r1(c[0])} ${r1(c[1])}`;

  // A soft sausage along a centre line, with a width at each point.

    for (let i = 0; i < n; i++) {

      let tx = b[0] - a[0], ty = b[1] - a[1];
      const m = Math.hypot(tx, ty) || 1;
      tx /= m; ty /= m;
      if (i === 0) t0 = [tx, ty];
      if (i === n - 1) t1 = [tx, ty];
      const h = w[i] / 2;
      L.push([c[i][0] - ty * h, c[i][1] + tx * h]);
      R.push([c[i][0] + ty * h, c[i][1] - tx * h]);
    }
    const s = c[0], e = c[n - 1], hs = w[0] / 2, he = w[n - 1] / 2;
    const pts = [...L];
    if (he > 1.5) pts.push([e[0] + t1[0] * he * .8, e[1] + t1[1] * he * .8]);
    pts.push(...R.reverse());
    if (hs > 1.5) pts.push([s[0] - t0[0] * hs * .8, s[1] - t0[1] * hs * .8]);

  const HUES = {
    green: ['#7fcf6c', '#eaf7cf', '#4c9c42'],
    teal: ['#52c3b2', '#dcf5ee', '#2c8f84'],
    blue: ['#6ea9ee', '#e0edff', '#3b74c6'],
    purple: ['#a78ce6', '#eee7ff', '#7056c4'],
    pink: ['#f594b8', '#ffe6f0', '#d65f8d'],
    orange: ['#f6a64f', '#ffeed6', '#d4742a'],
    yellow: ['#f1cd52', '#fff7d6', '#c4961e'],
    red: ['#ee7563', '#ffe4dc', '#c6493a'],
    brown: ['#c79c6e', '#f7e9d6', '#97693f'],
    lime: ['#b4d64e', '#f4fad8', '#7f9f22'],
  };

  function colorsFor(d) {
    const [body, belly, accent] = HUES[d.color];
    return {
      body, belly, accent,
      far: mix(body, INK, .2),
      accentFar: mix(accent, INK, .18),
      ol: mix(body, INK, .66),
      horn: '#fff3d8',
      hornFar: '#ead9b8',
      hornBeak: mix(body, INK, .4),
      beak: '#f3b746',

  function sceneSVG(scene, shadow) {
    if (scene === 'sky') {
      const cloud = (x, y, s) => `<path d="${smooth([[x - 22 * s, y + 6 * s], [x - 16 * s, y - 6 * s], [x - 4 * s, y - 10 * s], [x + 10 * s, y - 8 * s], [x + 22 * s, y + 4 * s], [x, y + 9 * s]])}" fill="#ffffff" opacity=".9"/>`;
      return cloud(196, 28, 1.1) + cloud(44, 140, .9);
    }
    if (scene === 'sea') {
      let s = `<path d="M0 14 Q15 6 30 14 T60 14 T90 14 T120 14 T150 14 T180 14 T210 14 T240 14" fill="none" stroke="#ffffff" stroke-width="3" opacity=".6"/>`;
      s += `<path d="${smooth([[-10, 176], [40, 158], [120, 160], [200, 156], [250, 176]])}" fill="#f2e2b4"/>`;
      s += `<path d="M214 160 q-10 -18 2 -34 q10 -14 -2 -30" fill="none" stroke="#5fb87a" stroke-width="5" stroke-linecap="round"/>`;
      for (const [x, y, r] of [[200, 60, 4], [208, 44, 2.6], [30, 40, 3.2], [22, 56, 2]]) s += `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#ffffff" stroke-width="1.8" opacity=".8"/>`;

    }
    const tuft = (x, y) => `<path d="M${x - 6} ${y} q2 -9 4 -12 M${x} ${y} q0 -10 1 -15 M${x + 6} ${y} q-2 -9 -4 -12" fill="none" stroke="#7cbf58" stroke-width="2.6" stroke-linecap="round"/>`;

      + tuft(22, 154) + tuft(220, 152)

  function drawDino(d, uid) {
    const C = colorsFor(d);
    const far = [], back = [], sil = [], near = [], top = [];
    let box = null, bellyD = null, shadow = [104, 80];
    const part = (p, fill, sw = 3.5) => `<path d="${p}" fill="${fill}" stroke="${C.ol}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const group = (paths, fill) => `<g>${paths.map(p => `<path d="${p}" fill="${C.ol}" stroke="${C.ol}" stroke-width="7" stroke-linejoin="round"/>`).join('')}${paths.map(p => `<path d="${p}" fill="${fill}"/>`).join('')}</g>`;
    const A = {
      C, part, group,
      far: s => far.push(s), back: s => back.push(s), sil: p => sil.push(p), near: s => near.push(s), top: s => top.push(s),
      box: b => { box = b; }, belly: p => { bellyD = p; }, shadow: (x, rx) => { shadow = [x, rx]; },
      sail(pts, ray, n) {
        let s = part(smooth(pts), C.accent);
        if (ray) {
          for (let i = 0; i < n; i++) {
            const x0 = ray[0][0] + i * ((pts[pts.length - 2][0] - ray[0][0]) / n);
            s += `<path d="M${r1(x0 + 6)} ${r1(ray[0][1] - 2)} L${r1(x0 + 6 + (i - n / 2) * 2)} ${r1(ray[1][1] + 14 + Math.abs(i - n / 2) * 7)}" stroke="${C.ol}" stroke-width="2" stroke-linecap="round" opacity=".35"/>`;
          }
        }
        return s;
      },
      fringe(c, w, t0, t1, n, len) {
        let s = '';
        for (let i = 0; i < n; i++) {
          const p = along(c, w, t0 + (t1 - t0) * i / (n - 1)), b = p.top, L = len * (i % 2 ? .75 : 1);
          s += part(smooth([[b[0] - p.tx * 4 - p.nx * 3, b[1] - p.ty * 4 - p.ny * 3], [b[0] + p.nx * L - p.tx * 5, b[1] + p.ny * L - p.ty * 5], [b[0] + p.tx * 4 - p.nx * 3, b[1] + p.ty * 4 - p.ny * 3]]), C.accent, 2.5);

        return s;
      },
      claws(x, y, s = 1) {
        top.push(`<ellipse cx="${r1(x + 1)}" cy="${r1(y)}" rx="${3.4 * s}" ry="${2.4 * s}" fill="${C.horn}" stroke="${C.ol}" stroke-width="1.6"/>`);
      },
      claw3(base, s, col) {
        let out = '';

          const b = [base[0] - i * 3, base[1] + i * 2];

        }
        return out;
      },
      toes(x, w) {
        top.push(`<ellipse cx="${r1(x + w * .18)}" cy="${GY - 1}" rx="3" ry="2.2" fill="${C.horn}" stroke="${C.ol}" stroke-width="1.5"/><ellipse cx="${r1(x + w * .46)}" cy="${GY - 2}" rx="2.6" ry="2" fill="${C.horn}" stroke="${C.ol}" stroke-width="1.5"/>`);
      },
      face(at, o) {

              const px = (1 - u) ** 2 * x1 + 2 * (1 - u) * u * ((x1 + x2) / 2) + u * u * x2;
              const py = (1 - u) ** 2 * y1 + 2 * (1 - u) * u * ((y1 + y2) / 2 + cv) + u * u * y2;

      + sceneSVG(scene, shadow)

      + `${near.join('')}${top.join('')}</g></svg>`;
  }
  function pt(p) { return `${r1(p[0])} ${r1(p[1])}`; }

  // ---------- Page ----------

  const THEMES = [

    { bg: '#fff3c4', rim: '#ffc93c', dark: '#d99a00', accent: '#a86200' },

  const $ = id => document.getElementById(id);

  const breakName = name => name.replace(/(saurus|saura|ceratops|raptor|mimus|nychus|pteryx|lophus|cephale|cephalus|pelta|taurus|physis|gnathus|odon|don|tyrannus|titan|pterus|rhynchus|venator|cosaurus)(\s|$)/, '<wbr>$1$2');

  function showLetter(L, animate = true) {

  // Pick the largest card size that fits this letter's dinosaurs on one screen (scrolls if none does).
  function fitCards() {
    if (innerWidth <= 560 || !current.length) { cardsEl.style.removeProperty('--cw'); return; }
    const gap = 16, W = cardsEl.clientWidth;
    const H = scene.clientHeight - scene.querySelector('.head').offsetHeight - 40;
    const info = cardsEl.querySelector('.info');
    const infoH = (info ? info.offsetHeight : 110) + 8;
    let best = 150;
    for (let w = 236; w >= 150; w -= 4) {
      const cols = Math.max(1, Math.floor((W + gap) / (w + gap)));
      const rows = Math.ceil(current.length / cols);
      if (rows * (w * 170 / 240 + infoH) + (rows - 1) * gap <= H) { best = w; break; }
    }

  function talk(card) {
    const d = current[+card.dataset.i];
    if (!d) return;
    for (const c of cardsEl.querySelectorAll('.card.now')) c.classList.remove('now');
    card.classList.remove('talk');
    void card.offsetWidth;
    card.classList.add('talk', 'now');
    clearTimeout(talkTimer);
    talkTimer = setTimeout(() => card.classList.remove('talk'), 850);
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    chime(+card.dataset.i + 2, .5);
    say(d.say, .8);
    live.textContent = d.name;

  const randomLetter = () => {
    let L;
    do L = LETTERS[Math.floor(Math.random() * 26)]; while (L === currentLetter);

  };

  // ---------- Alphabet strip ----------

  const keys = {};
  [...LETTERS].forEach((L, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key';
    b.textContent = L;
    b.setAttribute('aria-label', `Dinosaurs that start with ${L}`);
    b.style.setProperty('--c', THEMES[i % THEMES.length].rim);
    b.addEventListener('click', () => trigger(() => showLetter(L)));
    strip.append(b);
    keys[L] = b;
  });

  function markKey(L, seen = true) {
    if (currentLetter) keys[currentLetter].classList.remove('now');
    currentLetter = L;
    keys[L].classList.add('now');
    if (seen) keys[L].classList.add('seen');
  }

  // ---------- Sound ----------

  let soundOn = true;
  try { soundOn = localStorage.getItem('dino-sound') !== 'off'; } catch {}
  let actx = null;

  function chime(i, octave = 1) {
    if (!soundOn || !actx) return;
    try {
      const steps = [0, 2, 4, 7, 9];
      const semi = steps[i % 5] + 12 * (Math.floor(i / 5) % 2);
      const f = 392 * octave * Math.pow(2, semi / 12);
      const t = actx.currentTime;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      g.connect(actx.destination);

        const o = actx.createOscillator(), og = actx.createGain();
        o.type = type;
        o.frequency.value = f * mult;
        og.gain.value = level;
        o.connect(og).connect(g);
        o.start(t);
        o.stop(t + 0.65);

  }

  const canSpeak = 'speechSynthesis' in window;
  let voice = null, speakTimer = 0;
  function pickVoice() {
    try {

      voice = en.find(v => /Samantha|Google US English|Aria|Jenny|Ava|Karen|Serena/i.test(v.name))
        || en.find(v => v.default) || en[0] || null;
    } catch {}
  }
  if (canSpeak) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  function say(text, rate = 0.85) {
    if (!soundOn || !canSpeak) return;
    clearTimeout(speakTimer);
    try { speechSynthesis.cancel(); } catch {}
    speakTimer = setTimeout(() => {
      try {
        const u = new SpeechSynthesisUtterance(text);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
        u.rate = rate;
        u.pitch = 1.15;
        speechSynthesis.speak(u);
      } catch {}
    }, 200);
  }

  function setSound(on) {
    soundOn = on;
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.querySelector('span').textContent = on ? 'Sound on' : 'Sound off';
    if (!on && canSpeak) { clearTimeout(speakTimer); try { speechSynthesis.cancel(); } catch {} }
    try { localStorage.setItem('dino-sound', on ? 'on' : 'off'); } catch {}
  }
  soundBtn.addEventListener('click', () => { wake(); setSound(!soundOn); });
  setSound(soundOn);

  // ---------- Input ----------

  let lastAt = 0, lastTalk = 0, wakeLock = null;

  function wake() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    if (!wakeLock && navigator.wakeLock) {
      navigator.wakeLock.request('screen').then(l => {
        wakeLock = l;
        l.addEventListener('release', () => { wakeLock = null; });
      }).catch(() => {});
    }
  }

  function trigger(fn) {
    const now = performance.now();
    if (now - lastAt < GAP_MS) return;
    lastAt = now;
    wake();
    fn();
  }

  function talkTo(card) {
    const now = performance.now();
    if (!card || now - lastTalk < 250) return;
    lastTalk = now;
    wake();
    card.focus({ preventScroll: true });
    talk(card);
  }

  cardsEl.addEventListener('click', e => talkTo(e.target.closest('.card')));

  addEventListener('keydown', e => {
    if (/^F\d{1,2}$/.test(e.key)) return; // leave F5 / F11 for grown-ups
    e.preventDefault();
    if (e.repeat) return;
    const ch = e.key && e.key.length === 1 ? e.key.toUpperCase() : '';
    const cards = [...cardsEl.querySelectorAll('.card')];
    const at = cards.indexOf(document.activeElement);
    let m;
    if (/^[A-Z]$/.test(ch)) trigger(() => showLetter(ch));
    else if ((m = /^Key([A-Z])$/.exec(e.code))) trigger(() => showLetter(m[1]));
    else if (/^[1-9]$/.test(ch)) talkTo(cards[+ch - 1]);
    else if ((m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code))) talkTo(cards[+m[1] - 1]);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') talkTo(cards[(at + 1) % cards.length]);
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') talkTo(cards[(at - 1 + cards.length) % cards.length]);
    else if ((e.key === 'Enter' || e.key === ' ') && at >= 0) talkTo(cards[at]);
    else trigger(() => showLetter(randomLetter())); // other keys still do something
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  function syncFocus() {
    const focused = document.hasFocus();
    document.body.classList.toggle('away', !focused);
    hintText.textContent = focused ? 'Press a letter, then tap a dinosaur' : 'Tap or click to start';
  }
  addEventListener('focus', syncFocus);
  addEventListener('blur', syncFocus);
  syncFocus();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && lastAt) wake();
  });

  // ---------- Full screen ----------

  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  fsBtn.addEventListener('click', async () => {
    wake();
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else {
        await document.documentElement.requestFullscreen();
        try { await navigator.keyboard?.lock?.(); } catch {}
      }
    } catch {}
  });
  document.addEventListener('fullscreenchange', () => {
    const on = !!document.fullscreenElement;
    fsBtn.setAttribute('aria-pressed', String(on));
    fsBtn.querySelector('span').textContent = on ? 'Exit full screen' : 'Full screen';
  });

  showLetter('B', false);
  window.__dino = { DINOS, drawDino, byLetter }; // used by the preview-image script
})();
</script>
</body>
</html>
